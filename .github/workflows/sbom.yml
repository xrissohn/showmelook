name: SBOM

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate CycloneDX SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.0 --output-file sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: showmelook-cyclonedx-sbom
          path: sbom.cdx.json
          if-no-files-found: error
