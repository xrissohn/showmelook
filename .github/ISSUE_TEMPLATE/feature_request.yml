name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or contributor problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful change and its alternatives.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - MCP connector
        - Product catalog
        - Public looks
        - Web application
        - Developer experience
        - Documentation
    validations:
      required: true
  - type: textarea
    id: compliance
    attributes:
      label: Privacy, license, and model impact
      description: List new data, dependencies, licenses, models, or external services.
